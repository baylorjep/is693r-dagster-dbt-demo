name: 'bidi_contracting'
version: '1.0.0'
config-version: 2

profile: 'bidi_contracting'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Model configurations
models:
  bidi_contracting:
    # Staging models - ephemeral or view
    staging:
      +materialized: view
    # Mart models - table for performance
    marts:
      +materialized: table

# Snapshot configurations
snapshots:
  bidi_contracting:
    +target_schema: snapshots

# Test configurations
tests:
  bidi_contracting:
    +severity: warn

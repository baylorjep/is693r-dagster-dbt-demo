version: 2

models:
  - name: fct_takeoffs
    description: "Takeoff fact table with denormalized context - one row per extracted takeoff item"
    columns:
      - name: takeoff_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to projects"
        data_tests:
          - not_null
      - name: page_id
        description: "Foreign key to blueprint pages"
        data_tests:
          - not_null
      - name: cost_code
        description: "Foreign key to cost library"
        data_tests:
          - not_null
      - name: quantity
        description: "Quantity extracted from blueprint"
        data_tests:
          - not_null
      - name: confidence
        description: "AI confidence score (0-1)"
        data_tests:
          - not_null
      - name: extraction_method
        description: "Method used for extraction"
        data_tests:
          - accepted_values:
              values: ['ai', 'manual', 'hybrid']

  - name: fct_estimates
    description: "Estimate fact table - one row per estimate version per project"
    columns:
      - name: estimate_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to projects"
        data_tests:
          - not_null
      - name: estimate_total_mid
        description: "Mid-range estimate total in USD"
        data_tests:
          - not_null
      - name: estimation_method
        description: "Method used for estimation"
        data_tests:
          - accepted_values:
              values: ['ai', 'manual', 'hybrid']

  - name: mart_estimate_cost_breakdown
    description: "Cost totals by cost code and item type per project estimate"
    columns:
      - name: estimate_id
        description: "Foreign key to estimates"
        data_tests:
          - not_null
      - name: cost_code
        description: "Cost code for this breakdown"
        data_tests:
          - not_null
      - name: extended_cost_mid
        description: "Extended cost (quantity * unit_cost)"
        data_tests:
          - not_null

  - name: mart_takeoff_quality_monitoring
    description: "Quality metrics by project and discipline for monitoring takeoff accuracy"
    columns:
      - name: project_id
        description: "Foreign key to projects"
        data_tests:
          - not_null
      - name: discipline
        description: "Engineering discipline code"
        data_tests:
          - accepted_values:
              values: ['A', 'S', 'C', 'M', 'E', 'P']
      - name: avg_confidence
        description: "Average confidence score for discipline"
      - name: pct_low_confidence
        description: "Percentage of takeoffs with low confidence"

  - name: mart_estimation_dashboard
    description: "One row per project with headline metrics for estimation dashboard"
    columns:
      - name: project_id
        description: "Primary key - one row per project"
        data_tests:
          - unique
          - not_null
      - name: estimate_total_mid
        description: "Latest mid-range estimate total"
      - name: avg_confidence
        description: "Average takeoff confidence for project"
      - name: readiness_status
        description: "Overall project readiness status"
        data_tests:
          - accepted_values:
              values: ['No Estimate', 'Needs Review', 'In Progress', 'Ready']

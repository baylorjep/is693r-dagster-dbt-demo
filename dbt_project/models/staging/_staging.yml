version: 2

models:
  - name: stg_projects
    description: "Staged project data with standardized columns"
    columns:
      - name: project_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: client_name
        description: "Client company name"
      - name: project_type
        description: "Type of construction project"

  - name: stg_blueprint_pages
    description: "Staged blueprint page data with standardized columns"
    columns:
      - name: page_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to projects"
        data_tests:
          - not_null
      - name: discipline
        description: "Engineering discipline code"
        data_tests:
          - accepted_values:
              values: ['A', 'S', 'C', 'M', 'E', 'P']

  - name: stg_cost_library
    description: "Staged cost library data with standardized columns"
    columns:
      - name: cost_code
        description: "Primary key - CSI cost code"
        data_tests:
          - unique
          - not_null
      - name: unit_cost_mid
        description: "Mid-range unit cost"
        data_tests:
          - not_null

  - name: stg_takeoff_items
    description: "Staged takeoff item data with standardized columns"
    columns:
      - name: takeoff_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to projects"
        data_tests:
          - not_null
      - name: page_id
        description: "Foreign key to blueprint pages"
        data_tests:
          - not_null
      - name: cost_code
        description: "Foreign key to cost library"
        data_tests:
          - not_null
      - name: confidence
        description: "AI confidence score (0-1)"
        data_tests:
          - not_null
      - name: extraction_method
        description: "Method used for extraction"
        data_tests:
          - accepted_values:
              values: ['ai', 'manual', 'hybrid']

  - name: stg_estimates
    description: "Staged estimate data with standardized columns"
    columns:
      - name: estimate_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to projects"
        data_tests:
          - not_null
      - name: estimate_total_mid
        description: "Mid-range estimate total"
        data_tests:
          - not_null
      - name: estimation_method
        description: "Method used for estimation"
        data_tests:
          - accepted_values:
              values: ['ai', 'manual', 'hybrid']

  - name: stg_estimate_line_items
    description: "Staged estimate line item data with standardized columns"
    columns:
      - name: line_item_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: estimate_id
        description: "Foreign key to estimates"
        data_tests:
          - not_null
      - name: cost_code
        description: "Cost code for this line item"
        data_tests:
          - not_null

  - name: stg_qa_reviews
    description: "Staged QA review data with standardized columns"
    columns:
      - name: review_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to projects"
        data_tests:
          - not_null
      - name: issue_type
        description: "Type of QA issue"
        data_tests:
          - accepted_values:
              values: ['missing_item', 'quantity_mismatch', 'wrong_uom', 'duplicate', 'low_confidence', 'cost_outlier']
      - name: severity
        description: "Issue severity level"
        data_tests:
          - accepted_values:
              values: ['low', 'medium', 'high', 'critical']

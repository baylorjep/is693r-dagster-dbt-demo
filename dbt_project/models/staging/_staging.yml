version: 2

models:
  - name: stg_customers
    description: "Staged customer data with standardized columns"
    columns:
      - name: customer_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: "Concatenated first and last name"
      - name: email
        description: "Lowercase email address"

  - name: stg_vendors
    description: "Staged vendor data with standardized columns"
    columns:
      - name: vendor_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: vendor_tier
        description: "Vendor tier based on rating"
        data_tests:
          - accepted_values:
              values: ['Premium', 'Standard', 'Basic']

  - name: stg_requests
    description: "Staged request data with standardized columns"
    columns:
      - name: request_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customers"
        data_tests:
          - not_null

  - name: stg_bids
    description: "Staged bid data with standardized columns"
    columns:
      - name: bid_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: request_id
        description: "Foreign key to requests"
        data_tests:
          - not_null
      - name: vendor_id
        description: "Foreign key to vendors"
        data_tests:
          - not_null

  - name: stg_payments
    description: "Staged payment data with standardized columns"
    columns:
      - name: payment_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: bid_id
        description: "Foreign key to bids"
        data_tests:
          - not_null


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "is693r-dagster-dbt-demo"
version = "1.0.0"
description = "A modern ELT analytics pipeline using Dagster + dbt + DuckDB for Bidi Contracting blueprint takeoffs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Baylor Jeppsen", email = "baylor@example.com"}
]
keywords = ["dagster", "dbt", "duckdb", "elt", "analytics", "data-engineering", "construction", "estimation"]

dependencies = [
    "dagster>=1.6.0",
    "dagster-webserver>=1.6.0",
    "dagster-dbt>=0.22.0",
    "dbt-core>=1.7.0",
    "dbt-duckdb>=1.7.0",
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "faker>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dagster_project*"]

[tool.dagster]
module_name = "dagster_project.defs"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
